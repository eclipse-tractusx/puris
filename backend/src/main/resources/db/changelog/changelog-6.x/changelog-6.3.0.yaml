databaseChangeLog:
  - changeSet:
      id: "1"
      author: OlgaIvkovic
      changes:
        - dropNotNullConstraint:
            tableName: own_data_exchange_request
            columnName: notification_uuid
            columnDataType: UUID
        - dropNotNullConstraint:
            tableName: reported_data_exchange_request
            columnName: notification_uuid
            columnDataType: UUID
        - addColumn:
            tableName: own_data_exchange_request
            columns:
              - column:
                  name: partner_uuid
                  type: UUID
              - column:
                  name: source_disruption_id
                  type: UUID
              - column:
                  name: effect
                  type: SMALLINT
        - addColumn:
            tableName: reported_data_exchange_request
            columns:
              - column:
                  name: partner_uuid
                  type: UUID
              - column:
                  name: source_disruption_id
                  type: UUID
              - column:
                  name: effect
                  type: SMALLINT
        - addNotNullConstraint:
            tableName: own_data_exchange_request
            columnName: partner_uuid
            columnDataType: UUID
        - addNotNullConstraint:
            tableName: own_data_exchange_request
            columnName: source_disruption_id
            columnDataType: UUID
        - addNotNullConstraint:
            tableName: own_data_exchange_request
            columnName: effect
            columnDataType: SMALLINT
        - addNotNullConstraint:
            tableName: reported_data_exchange_request
            columnName: partner_uuid
            columnDataType: UUID
        - addNotNullConstraint:
            tableName: reported_data_exchange_request
            columnName: source_disruption_id
            columnDataType: UUID
        - addNotNullConstraint:
            tableName: reported_data_exchange_request
            columnName: effect
            columnDataType: SMALLINT
        - addForeignKeyConstraint:
            baseTableName: own_data_exchange_request
            baseColumnNames: partner_uuid
            referencedTableName: partner
            referencedColumnNames: uuid
            constraintName: fk_own_data_exchange_request_partner
        - addForeignKeyConstraint:
            baseTableName: reported_data_exchange_request
            baseColumnNames: partner_uuid
            referencedTableName: partner
            referencedColumnNames: uuid
            constraintName: fk_reported_data_exchange_request_partner
        - createIndex:
            indexName: idx_own_data_exchange_request_source_disruption_id
            tableName: own_data_exchange_request
            columns:
              - column:
                  name: source_disruption_id
        - createIndex:
            indexName: idx_reported_data_exchange_request_source_disruption_id
            tableName: reported_data_exchange_request
            columns:
              - column:
                  name: source_disruption_id
  - changeSet:
      id: "2"
      author: OlgaIvkovic
      changes:
        - createTable:
            tableName: data_exchange_request_material
            columns:
              - column:
                  name: data_exchange_request_uuid
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: data_exchange_request_material_pkey
              - column:
                  name: material_own_material_number
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: data_exchange_request_material_pkey
        - addForeignKeyConstraint:
            baseTableName: data_exchange_request_material
            baseColumnNames: material_own_material_number
            referencedTableName: material
            referencedColumnNames: own_material_number
            constraintName: fk_data_exchange_request_material_material
        - createTable:
            tableName: data_exchange_request_affected_sites_sender
            columns:
              - column:
                  name: data_exchange_request_uuid
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: data_exchange_request_affected_sites_sender_pkey
              - column:
                  name: site_bpns
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: data_exchange_request_affected_sites_sender_pkey
        - addForeignKeyConstraint:
            baseTableName: data_exchange_request_affected_sites_sender
            baseColumnNames: site_bpns
            referencedTableName: site
            referencedColumnNames: bpns
            constraintName: fk_data_exchange_request_affected_sites_sender_site
        - createTable:
            tableName: data_exchange_request_affected_sites_recipient
            columns:
              - column:
                  name: data_exchange_request_uuid
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: data_exchange_request_affected_sites_recipient_pkey
              - column:
                  name: site_bpns
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: data_exchange_request_affected_sites_recipient_pkey
        - addForeignKeyConstraint:
            baseTableName: data_exchange_request_affected_sites_recipient
            baseColumnNames: site_bpns
            referencedTableName: site
            referencedColumnNames: bpns
            constraintName: fk_data_exchange_request_affected_sites_recipient_site
  - changeSet:
      id: "3"
      author: OlgaIvkovic
      changes:
        - createTable:
            tableName: chain_opening_grant_request
            columns:
              - column:
                  name: chain_opening_grant_uuid
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: data_exchange_request_uuid
                  type: UUID
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: chain_opening_grant_request
            columnNames: chain_opening_grant_uuid, data_exchange_request_uuid
            constraintName: uc_chain_opening_grant_request_key
        - addForeignKeyConstraint:
            baseColumnNames: chain_opening_grant_uuid
            baseTableName: chain_opening_grant_request
            constraintName: fk_chain_opening_grant_request_grant
            referencedColumnNames: uuid
            referencedTableName: chain_opening_grant
        - addForeignKeyConstraint:
            baseColumnNames: data_exchange_request_uuid
            baseTableName: chain_opening_grant_request
            constraintName: fk_chain_opening_grant_request_request
            referencedColumnNames: uuid
            referencedTableName: own_data_exchange_request
        - createTable:
            tableName: chain_opening_root_grant_request
            columns:
              - column:
                  name: chain_opening_root_grant_uuid
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: data_exchange_request_uuid
                  type: UUID
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: chain_opening_root_grant_request
            columnNames: chain_opening_root_grant_uuid, data_exchange_request_uuid
            constraintName: uc_chain_opening_root_grant_request_key
        - addForeignKeyConstraint:
            baseColumnNames: chain_opening_root_grant_uuid
            baseTableName: chain_opening_root_grant_request
            constraintName: fk_chain_opening_root_grant_request_grant
            referencedColumnNames: uuid
            referencedTableName: chain_opening_root_grant
        - addForeignKeyConstraint:
            baseColumnNames: data_exchange_request_uuid
            baseTableName: chain_opening_root_grant_request
            constraintName: fk_chain_opening_root_grant_request_request
            referencedColumnNames: uuid
            referencedTableName: own_data_exchange_request
  - changeSet:
      id: "4"
      author: OlgaIvkovic
      changes:
        - dropTable:
            tableName: chain_opening_grant_notification
        - dropTable:
            tableName: chain_opening_root_grant_notification

    cpu: 250m
    memory: 0.5Gi

job:
  batch:
    threadCount: 5
  scheduled:
    threadCount: 5
  cached:
    threadCount: 5

management:
  health:
    dependencies:
      enabled: false  # Flag to determine if external service healthcheck endpoints should be checked
      urls: {}  # Map of services with corresponding healthcheck endpoint url's. Example:
      # sample url
      # service_name: http://service_name_host.com/health

minio:
  enabled: true
  persistence:
    enabled: true
    size: 1Gi
  image:
    repository: quay.io/minio/minio
    # overwrite minio version RELEASE.2022-11-11T03-44-20Z as this is not found in bitnami legacy
    tag: RELEASE.2022-11-11T03-44-20Z

#    clientImage:
#      image:
#        repository: bitnamilegacy/minio-client
#    volumePermissions:
#      image:
#        repository: bitnamilegacy/minideb

# reduce memory footprint, use same limit as irs, but less replicas
  replicas: 1
  mode: "standalone"
  resources:
    requests:
      cpu: 150m
      memory: 1Gi
    limits:
      cpu: 1
      memory: 1Gi


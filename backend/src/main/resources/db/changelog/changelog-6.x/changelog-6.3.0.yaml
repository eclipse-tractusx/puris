databaseChangeLog:
  - changeSet:
        id: "1"
        author: OlgaIvkovic
        changes:
          - createTable:
              tableName: external_material_relation
              columns:
                - column:
                    name: uuid
                    type: UUID
                    constraints:
                      nullable: false
                      primaryKey: true
                      primaryKeyName: external_material_relation_pkey
                - column:
                    name: material_own_material_number
                    type: VARCHAR(255)
                    constraints:
                      nullable: false
                - column:
                    name: partner_uuid
                    type: UUID
                    constraints:
                      nullable: false
                - column:
                    name: parent_global_asset_id
                    type: VARCHAR(255)
                    constraints:
                      nullable: false
                - column:
                    name: valid_from
                    type: TIMESTAMP WITHOUT TIME ZONE
                - column:
                    name: valid_to
                    type: TIMESTAMP WITHOUT TIME ZONE
                - column:
                    name: created_on
                    type: TIMESTAMP WITHOUT TIME ZONE
                - column:
                    name: last_modified_on
                    type: TIMESTAMP WITHOUT TIME ZONE
                - column:
                    name: quantity
                    type: FLOAT8
                    constraints:
                      nullable: false
                - column:
                    name: measurement_unit
                    type: SMALLINT
                    constraints:
                        nullable: false
          - addUniqueConstraint:
              tableName: external_material_relation
              columnNames: material_own_material_number, partner_uuid, parent_global_asset_id
              constraintName: uc_external_material_relation_key
          - addForeignKeyConstraint:
              baseColumnNames: material_own_material_number
              baseTableName: external_material_relation
              constraintName: fk_external_material_relation_to_material
              referencedColumnNames: own_material_number
              referencedTableName: material
          - addForeignKeyConstraint:
              baseColumnNames: partner_uuid
              baseTableName: external_material_relation
              constraintName: fk_external_material_relation_to_partner
              referencedColumnNames: uuid
              referencedTableName: partner
  - changeSet:
        id: "2"
        author: OlgaIvkovic
        changes:
          - createTable:
              tableName: digital_twin_event_contract_mapping
              columns:
                - column:
                    name: partner_bpnl
                    type: VARCHAR(255)
                    constraints:
                      nullable: false
                      primaryKey: true
                      primaryKeyName: digital_twin_event_contract_mapping_pkey
  - changeSet:
        id: "3"
        author: OlgaIvkovic
        changes:
          - createTable:
                columns:
                  - column:
                      constraints:
                        nullable: false
                        primaryKey: true
                        primaryKeyName: single_level_usage_as_planned_contract_mapping_pkey
                      name: partner_bpnl
                      type: VARCHAR(255)
                tableName: single_level_usage_as_planned_contract_mapping
  - changeSet:
      id: "4"
      author: sofijadjukic8020
      changes:
        - delete:
            tableName: reported_anonymized_delivery

        - delete:
            tableName: reported_anonymized_stock

        - delete:
            tableName: reported_anonymized_production

        - delete:
            tableName: aggregated_material_data_node

        - delete:
            tableName: aggregated_material_data

        - addColumn:
            tableName: aggregated_material_data
            columns:
              - column:
                  name: source_disruption_id
                  type: VARCHAR(255)
              - column:
                  name: job_id
                  type: UUID
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: aggregated_material_data
            columnNames: job_id
            constraintName: uc_aggregated_material_data_job_id

        - addUniqueConstraint:
            tableName: aggregated_material_data
            columnNames: source_disruption_id, material_own_material_number
            constraintName: uc_aggregated_material_data_source_disruption_material

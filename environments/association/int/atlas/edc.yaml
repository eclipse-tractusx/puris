edc:
  participant:
    # TODO edc 0.13.x
    # id: <path:atlas-1/data/companies/atlas#did-url>
    # # -- BPN Number
    # bpnl: <path:atlas-1/data/companies/atlas#bpnl>
    # edc 0.12.x
    id: <path:atlas-1/data/companies/atlas#bpnl>
    # migration 0.11.x -> 0.12.x: add context id for multitenancy
    contextId: <path:atlas-1/data/companies/atlas#context-id>

  controlplane:

    # -- endpoints of the control plane
    endpoints:
      management:
        authKey: <path:atlas-1/data/companies/atlas/edc#api-key>

    ## Ingress declaration to expose the network service.
    ingresses:
      ## Public / Internet facing Ingress
      - enabled: true
        # -- The hostname to be used to precisely map incoming traffic onto the underlying network service
        hostname: <path:atlas-1/data/companies/atlas/edc#hostname-internet>
        # -- Additional ingress annotations to add
        annotations:
          # cert manager for ingress on CX int
          cert-manager.io/cluster-issuer: "letsencrypt-prod"
        # -- EDC endpoints exposed by this ingress resource
        endpoints:
          - protocol
          - management
        # -- Defines the [ingress class](https://kubernetes.io/docs/concepts/services-networking/ingress/#ingress-class)  to use
        className: "nginx"
        # -- TLS [tls class](https://kubernetes.io/docs/concepts/services-networking/ingress/#tls) applied to the ingress resource
        tls:
          # -- Enables TLS on the ingress resource
          enabled: true
          # -- If present overwrites the default secret name
          secretName: tls-secret-edc-atlas-controlplane
      ## Public / Internet facing Ingress
      - enabled: true
        # -- The hostname to be used to precisely map incoming traffic onto the underlying network service
        hostname: <path:atlas-1/data/companies/atlas/edc#hostname-intranet>
        # -- EDC endpoints exposed by this ingress resource
        endpoints:
          - control
        # -- Defines the [ingress class](https://kubernetes.io/docs/concepts/services-networking/ingress/#ingress-class)  to use
        className: "nginx"
        # -- TLS [tls class](https://kubernetes.io/docs/concepts/services-networking/ingress/#tls) applied to the ingress resource
        tls:
          # -- Enables TLS on the ingress resource
          enabled: false

  # TODO edc 0.13.x
  # dcp:
  # edc 0.12.x
  iatp:
    # Decentralized IDentifier
    id: <path:atlas-1/data/companies/atlas#did-url>
    # -- Configures the trusted issuers for this runtime
    trustedIssuers: # array [] that needs to be expand but likely like (sorry unconfirmed on how this is done, as I also would need to check)
      - <path:atlas-1/data/environment/wallet#trusted-issuer-1>
    sts:
      # TODO edc 0.13.0
      # div:
      #   url: <path:atlas-1/data/environment/wallet#dim-base-url>
      # TODO current 0.12.x
      dim:
        url: <path:atlas-1/data/environment/wallet#dim-base-url>
      oauth:
        token_url: <path:atlas-1/data/companies/atlas#dim-idp-token-url>
        client:
          id: <path:atlas-1/data/companies/atlas#dim-idp-client-id>
          # not supported, see https://github.com/eclipse-edc/Connector/discussions/4135
          # secret_alias: "atlas-1/data/companies/atlas#dim-idp-client-secret"
          secret_alias: "companies/atlas/edc/dim-client-secret"
    # migration 0.11.x -> 0.12.x: cache verified credentials for a certain time to reduce load on the DIM
    cache:
      # -- Whether the Verifiable Presentation cache is enabled
      enabled: false
      # -- Validity of the Verifiable Presentation cache in seconds
      validity: 0
    # migration 0.11.x -> 0.12.x: add feature to register connector service in DID
    didService:
      selfRegistration:
        enabled: false
        # -- The URL of the BDRS to register the runtime's DID at
        id: <path:atlas-1/data/companies/atlas#did-url>

  dataplane:
    endpoints:
      proxy:
        authKey: <path:atlas-1/data/companies/atlas/edc#api-key>

    token:
      signer:
        privatekey_alias: companies/atlas/edc/dataplane-proxy/private-key
      verifier:
        publickey_alias: companies/atlas/edc/dataplane-proxy/public-key

    # "valueFrom" environment variable references that will be added to deployment pods. Name is templated.
    # ref: https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.19/#envvarsource-v1-core
    ## Ingress declaration to expose the network service.
    ingresses:
      ## Public / Internet facing Ingress
      - enabled: true
        # -- The hostname to be used to precisely map incoming traffic onto the underlying network service
        hostname: <path:atlas-1/data/companies/atlas/edc#hostname-internet>
        # -- Additional ingress annotations to add
        annotations:
          # cert manager for ingress on CX int
          cert-manager.io/cluster-issuer: "letsencrypt-prod"
        # -- EDC endpoints exposed by this ingress resource
        endpoints:
          - public
        # -- Defines the [ingress class](https://kubernetes.io/docs/concepts/services-networking/ingress/#ingress-class)  to use
        className: "nginx"
        # -- TLS [tls class](https://kubernetes.io/docs/concepts/services-networking/ingress/#tls) applied to the ingress resource
        tls:
          # -- Enables TLS on the ingress resosurce
          enabled: true
          # -- If present overwrites the default secret name
          secretName: tls-secret-edc-atlas-dataplane
        ## Adds [cert-manager](https://cert-manager.io/docs/) annotations to the ingress resource
  postgresql:
    # not needed anymore since 0.10.2
    # image:
    #   repository: bitnamilegacy/postgresql
    #   tag: 16.2.0-debian-12-r10
    jdbcUrl: "jdbc:postgresql://{{ .Release.Name }}-postgresql:5432/<path:atlas-1/data/companies/atlas/edc/postgres#database>"


    # TODO edc 0.13.0 with cloudpirates and custom user
    # auth:
    #   database: "postgres"
    #   username: "postgres"
    #   password: <path:atlas-1/data/companies/atlas/edc/postgres#postgresPassword>
    # customUser:
    #   # --  Name of the custom user to be created. If an existing secret is used, this value is overwritten into the existing secret.
    #   # @default -- edc
    #   name: <path:atlas-1/data/companies/atlas/edc/postgres#user>
    #   # -- Name for the custom database to be created and assigned to the custom user. If an existing secret is used, this value is overwritten into the existing secret.
    #   # @default -- edc
    #   database: <path:atlas-1/data/companies/atlas/edc/postgres#database>
    #   # -- Password to be used for the custom user. If an existing secret is used, this value is overwritten into the existing secret.
    #   # @default -- Autogenerated random alpha=numeric string with 16 characters (if empty).
    #   password: <path:atlas-1/data/companies/atlas/edc/postgres#password>
    # edc 0.12.x without cloudpirates and custom user
    auth:
      database: <path:atlas-1/data/companies/atlas/edc/postgres#database>
      username: <path:atlas-1/data/companies/atlas/edc/postgres#user>
      password: <path:atlas-1/data/companies/atlas/edc/postgres#password>
      postgresPassword: <path:atlas-1/data/companies/atlas/edc/postgres#postgresPassword>

  vault:
    hashicorp:
      token: <path:atlas-1/data/environment/vault#token>


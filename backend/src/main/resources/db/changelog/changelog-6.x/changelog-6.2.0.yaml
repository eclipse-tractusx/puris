                    nullable: false
        - addUniqueConstraint:
            tableName: chain_opening_grant_notification
            columnNames: chain_opening_grant_uuid, reported_notification_uuid
            constraintName: uc_chain_opening_grant_notification_key
        - addForeignKeyConstraint:
            baseColumnNames: chain_opening_grant_uuid
            baseTableName: chain_opening_grant_notification
            constraintName: fk_chain_opening_grant_notification_grant
            referencedColumnNames: uuid
            referencedTableName: chain_opening_grant
        - addForeignKeyConstraint:
            baseColumnNames: reported_notification_uuid
            baseTableName: chain_opening_grant_notification
            constraintName: fk_chain_opening_grant_notification_notification
            referencedColumnNames: uuid
            referencedTableName: reported_demand_and_capacity_notification

databaseChangeLog:
  - changeSet:
        id: "1"
        author: OlgaIvkovic
        changes:
          - createTable:
              tableName: external_material_relation
              columns:
                - column:
                    name: uuid
                    type: UUID
                    constraints:
                      nullable: false
                      primaryKey: true
                      primaryKeyName: external_material_relation_pkey
                - column:
                    name: material_own_material_number
                    type: VARCHAR(255)
                    constraints:
                      nullable: false
                - column:
                    name: partner_uuid
                    type: UUID
                    constraints:
                      nullable: false
                - column:
                    name: parent_global_asset_id
                    type: VARCHAR(255)
                    constraints:
                      nullable: false
                - column:
                    name: valid_from
                    type: TIMESTAMP WITHOUT TIME ZONE
                - column:
                    name: valid_to
                    type: TIMESTAMP WITHOUT TIME ZONE
                - column:
                    name: created_on
                    type: TIMESTAMP WITHOUT TIME ZONE
                - column:
                    name: last_modified_on
                    type: TIMESTAMP WITHOUT TIME ZONE
                - column:
                    name: quantity
                    type: FLOAT8
                    constraints:
                      nullable: false
                - column:
                    name: measurement_unit
                    type: SMALLINT
                    constraints:
                        nullable: false
          - addUniqueConstraint:
              tableName: external_material_relation
              columnNames: material_own_material_number, partner_uuid, parent_global_asset_id
              constraintName: uc_external_material_relation_key
          - addForeignKeyConstraint:
              baseColumnNames: material_own_material_number
              baseTableName: external_material_relation
              constraintName: fk_external_material_relation_to_material
              referencedColumnNames: own_material_number
              referencedTableName: material
          - addForeignKeyConstraint:
              baseColumnNames: partner_uuid
              baseTableName: external_material_relation
              constraintName: fk_external_material_relation_to_partner
              referencedColumnNames: uuid
              referencedTableName: partner
  - changeSet:
        id: "2"
        author: OlgaIvkovic
        changes:
          - createTable:
              tableName: digital_twin_event_contract_mapping
              columns:
                - column:
                    name: partner_bpnl
                    type: VARCHAR(255)
                    constraints:
                      nullable: false
                      primaryKey: true
                      primaryKeyName: digital_twin_event_contract_mapping_pkey